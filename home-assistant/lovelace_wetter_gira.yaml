title: Wetter
views:
  - title: Wetter
    path: wetter
    icon: mdi:weather-partly-cloudy
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Aktueller Zustand
          - type: markdown
            content: >-
              {% set st = states('sensor.gira_wetter_sensorstatus') | int(-1) %}

              {% if st < 0 %}### ⏳ Warte auf Wetterstation

              {% elif st | bitwise_and(65532) %}### ⚠️ Sensorprüfung
              erforderlich

              {% if st | bitwise_and(4096) %}Windgeschwindigkeit ist ungültig.
              Der Ersatzwert 50 m/s (180 km/h) ist **kein gemessener Wind**.

              {% endif %}{% if st | bitwise_and(8192) %}Die Station meldet auch
              die Windrichtung als ungültig.

              {% endif %}Details unter **Diagnose & GPS**.

              {% else %}### 🌦️ Wetterstation empfängt Messwerte

              {% endif %}

              Nur Anzeige · Beschattungssteuerung deaktiviert.
          - type: tile
            entity: binary_sensor.gira_wetter_regen
            name: Regen
            icon: mdi:weather-rainy
            tap_action:
              action: more-info
            icon_tap_action:
              action: more-info
          - type: tile
            entity: binary_sensor.gira_wetter_versorgung_ok
            name: Versorgung
            icon: mdi:power-plug
            tap_action:
              action: more-info
            icon_tap_action:
              action: more-info
      - type: grid
        cards:
          - type: heading
            heading: Temperatur & Luft
          - type: tile
            entity: sensor.gira_wetter_temperatur
            name: Außentemperatur
            icon: mdi:thermometer
            tap_action:
              action: more-info
            icon_tap_action:
              action: more-info
          - type: tile
            entity: sensor.gira_wetter_gefuehlte_temperatur
            name: Gefühlt
            icon: mdi:thermometer-lines
            tap_action:
              action: more-info
            icon_tap_action:
              action: more-info
          - type: tile
            entity: sensor.gira_wetter_luftfeuchte
            name: Luftfeuchte
            icon: mdi:water-percent
            tap_action:
              action: more-info
            icon_tap_action:
              action: more-info
          - type: tile
            entity: sensor.gira_wetter_luftdruck_hpa
            name: Luftdruck
            icon: mdi:gauge
            tap_action:
              action: more-info
            icon_tap_action:
              action: more-info
          - type: history-graph
            title: Temperatur · 24 Stunden
            hours_to_show: 24
            entities:
              - sensor.gira_wetter_temperatur
              - sensor.gira_wetter_gefuehlte_temperatur
      - type: grid
        cards:
          - type: heading
            heading: Wind & Sonne
          - type: tile
            entity: sensor.gira_wetter_wind_anzeige
            name: Wind · gültige Messung
            icon: mdi:weather-windy
            tap_action:
              action: more-info
            icon_tap_action:
              action: more-info
          - type: tile
            entity: sensor.gira_wetter_windrichtung
            name: Windrichtung
            icon: mdi:compass
            tap_action:
              action: more-info
            icon_tap_action:
              action: more-info
          - type: tile
            entity: sensor.gira_wetter_globalstrahlung
            name: Globalstrahlung
            icon: mdi:white-balance-sunny
            tap_action:
              action: more-info
            icon_tap_action:
              action: more-info
          - type: tile
            entity: sensor.gira_wetter_helligkeit_gesamt
            name: Helligkeit
            icon: mdi:brightness-6
            tap_action:
              action: more-info
            icon_tap_action:
              action: more-info
          - type: markdown
            content: Windanzeige nur bei gültigem Sensorstatus und Versorgung. Der Geräte-Ersatzwert 50 m/s (180 km/h) wird ausgeblendet.
  - title: Sonne & Helligkeit
