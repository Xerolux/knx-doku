  - triggers:
      - trigger: knx.telegram
        destination: ["5/1/0", "5/1/20"]
        group_value_read: false
        outgoing: false
    conditions:
      - condition: template
        value_template: "{{ trigger.source == '1.1.11' and trigger.payload in [0, 1] }}"
    sensor:
      - name: "EG Fenster Küche links klein Empfang"
        unique_id: "eg_fenster_kuche_links_klein_empfang"
        default_entity_id: "sensor.eg_fenster_kuche_links_klein_empfang"
        entity_category: diagnostic
        state: "{{ trigger.timestamp }}"
        attributes:
          offen: "{{ trigger.payload if trigger.destination == '5/1/0' else this.attributes.get('offen') }}"
          gekippt: "{{ trigger.payload if trigger.destination == '5/1/20' else this.attributes.get('gekippt') }}"
  - triggers:
