template:
  - sensor:
      - name: "EG Fenster Küche links klein Stellung"
        unique_id: "eg_fenster_kuche_links_klein_stellung"
        default_entity_id: "sensor.eg_fenster_kuche_links_klein_stellung"
        state: >-
          {% set offen = state_attr('sensor.eg_fenster_kuche_links_klein_empfang', 'offen') %}
          {% set gekippt = state_attr('sensor.eg_fenster_kuche_links_klein_empfang', 'gekippt') %}
          {% if gekippt == 1 %}Gekippt
          {% elif offen == 1 %}Offen
          {% elif offen == 0 and gekippt == 0 %}Geschlossen
          {% else %}Unbekannt{% endif %}
        icon: >-
          {% set offen = state_attr('sensor.eg_fenster_kuche_links_klein_empfang', 'offen') %}
          {% set gekippt = state_attr('sensor.eg_fenster_kuche_links_klein_empfang', 'gekippt') %}
          {% if gekippt == 1 %}mdi:window-open-variant
          {% elif offen == 1 %}mdi:window-open
          {% elif offen == 0 and gekippt == 0 %}mdi:window-closed
          {% else %}mdi:help-circle-outline{% endif %}
      - name: "EG Fenster Küche rechts groß Stellung"
