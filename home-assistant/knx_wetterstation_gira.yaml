template:
  - triggers:
      - trigger: knx.telegram
        destination: "4/0/15"
        group_value_read: false
        outgoing: false
    conditions:
      - condition: template
        value_template: "{{ trigger.source == '1.1.40' and trigger.payload is sequence and trigger.payload | length == 3 }}"
    sensor:
      - name: "Gira Wetter GPS Uhrzeit"
        unique_id: gira_wetter_gps_uhrzeit
        default_entity_id: sensor.gira_wetter_gps_uhrzeit
        state: >-
          {{ '%02d:%02d:%02d' | format(trigger.payload[0] | bitwise_and(31), trigger.payload[1] | bitwise_and(63), trigger.payload[2] | bitwise_and(63)) }}
  - triggers:
      - trigger: knx.telegram
        destination: "4/0/16"
        group_value_read: false
        outgoing: false
    conditions:
      - condition: template
        value_template: "{{ trigger.source == '1.1.40' and trigger.payload is sequence and trigger.payload | length == 3 }}"
    sensor:
      - name: "Gira Wetter GPS Datum"
        unique_id: gira_wetter_gps_datum
        default_entity_id: sensor.gira_wetter_gps_datum
        state: >-
          {% set y = trigger.payload[2] | bitwise_and(127) %}{{ '%04d-%02d-%02d' | format(2000+y if y < 90 else 1900+y, trigger.payload[1] | bitwise_and(15), trigger.payload[0] | bitwise_and(31)) }}
  - sensor:
      - name: Gira Wetter Windgeschwindigkeit gültig
        unique_id: gira_wetter_wind_anzeige
        default_entity_id: sensor.gira_wetter_wind_anzeige
        unit_of_measurement: km/h
        device_class: wind_speed
        state_class: measurement
        availability: >-
          {{ has_value('sensor.gira_wetter_windgeschwindigkeit') and has_value('sensor.gira_wetter_sensorstatus') and is_state('binary_sensor.gira_wetter_versorgung_ok','on') and (states('sensor.gira_wetter_sensorstatus') | int(32764) | bitwise_and(36864)) == 0 and (states('sensor.gira_wetter_windgeschwindigkeit') | float(180)) < (50 if state_attr('sensor.gira_wetter_windgeschwindigkeit','unit_of_measurement') == 'm/s' else 180) }}
        state: >-
          {{ (states('sensor.gira_wetter_windgeschwindigkeit') | float * (3.6 if state_attr('sensor.gira_wetter_windgeschwindigkeit','unit_of_measurement') == 'm/s' else 1)) | round(1) }}
      - name: Gira Wetter Luftdruck hPa
        unique_id: gira_wetter_luftdruck_hpa
        default_entity_id: sensor.gira_wetter_luftdruck_hpa
        unit_of_measurement: hPa
        device_class: atmospheric_pressure
        state_class: measurement
        availability: "{{ has_value('sensor.gira_wetter_luftdruck') }}"
        state: "{{ (states('sensor.gira_wetter_luftdruck') | float / 100) | round(1) }}"
automation:
  - id: gira_wetter_gps_leseanfragen
    alias: Gira Wetter GPS Zeit und Datum lesen
    triggers:
      - trigger: homeassistant
        event: start
      - trigger: time_pattern
        minutes: "/5"
    actions:
      - action: knx.read
        data:
          address: ["4/0/15", "4/0/16"]
    mode: single
