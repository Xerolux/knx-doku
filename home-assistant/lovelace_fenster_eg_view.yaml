  - title: Fenster
    path: fenster
    icon: mdi:window-open-variant
    type: sections
    max_columns: 4
    sections:
      - type: grid
        column_span: 2
        cards:
          - type: custom:button-card
            template: title_text
            name: 🪟 Fenster & Türen
          - type: grid
            columns: 3
            square: false
            cards:
              - type: custom:button-card
                template: base_card
                entity: sensor.eg_fenster_kuche_links_klein_stellung
                name: "Küche links klein"
                tap_action:
                  action: more-info
                styles:
                  card:
                    - background: |
                        [[[
                          const s = entity?.state;
                          if (s === 'Geschlossen') return 'linear-gradient(135deg, #3a4a5c, #2c3e50)';
                          if (s === 'Gekippt') return 'linear-gradient(135deg, #b7791f, #975a16)';
                          if (s === 'Offen') return 'linear-gradient(135deg, #c53030, #9b2c2c)';
                          return 'linear-gradient(135deg, #5f6368, #3c4043)';
                        ]]]
                state_display: |
                  [[[ return ['Geschlossen', 'Gekippt', 'Offen'].includes(entity?.state) ? entity.state : 'Unbekannt'; ]]]
              - type: custom:button-card
                template: base_card
                entity: sensor.eg_fenster_kuche_rechts_gross_stellung
